[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelingPS"
version = "0.1.0"
description = "Lorentzian fitting of X-ray power density spectra for MAXI J1820+070."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Kartik Mandar" }
]
dependencies = [
  "numpy>=2.3",
  "scipy>=1.17",
  "matplotlib>=3.10",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4",
]

[project.scripts]
modelingps-fit = "modelingPS.cli:fit_main"
modelingps-analyze = "modelingPS.cli:analyze_main"

[tool.hatch.build.targets.wheel]
packages = ["src/modelingPS"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/pyproject.toml",
  "/src/modelingPS",
  "/tests",
]
